# Builds the Economy Core mod in the cloud and ships the jar into the pack.
# Push a branch named mod-build/<anything>: this builds economy-core/, swaps the jar in mods/, runs
# packwiz refresh and commits the result back to that branch. Merge the branch into main to ship it.
# It also adds any mods listed in .github/packwiz-add.txt (one per line: "curseforge <slug>" or "modrinth <slug>"),
# because cloud sessions can't reach the CurseForge or Modrinth APIs. The list file is deleted once added.
name: Build Economy Core

on:
  push:
    branches: ['mod-build/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci-built]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest
      - name: Add listed mods
        run: |
          if [ -f .github/packwiz-add.txt ]; then
            while read -r source slug; do
              [ -z "$source" ] && continue
              ~/go/bin/packwiz "$source" add "$slug" -y < /dev/null
            done < .github/packwiz-add.txt
            git rm -q .github/packwiz-add.txt
          fi
      - name: Build the mod
        working-directory: economy-core
        run: |
          chmod +x gradlew fetch_libs.sh
          ./fetch_libs.sh
          ./gradlew build --no-daemon
      - name: Swap the jar into the pack
        run: |
          version=$(grep '^mod_version=' economy-core/gradle.properties | cut -d= -f2)
          rm -f mods/economy_core-*.jar
          cp "economy-core/build/libs/economy_core-${version}.jar" mods/
          ~/go/bin/packwiz refresh
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Commit the built jar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A mods index.toml pack.toml .github
          git diff --cached --quiet && exit 0
          git commit -m "Economy Core ${VERSION}: built jar and listed mods [ci-built]"
          git push
